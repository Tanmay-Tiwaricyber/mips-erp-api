name: keepalive

# Render's free tier sleeps after 15 min of no traffic.
# Add API_URL as a repository secret (Settings → Secrets → Actions).
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "API_URL secret not set — skipping"; exit 0
          fi
          curl -sf --max-time 30 "${{ secrets.API_URL }}/healthz" \
            && echo "awake" \
            || echo "cold start (expected occasionally)"
